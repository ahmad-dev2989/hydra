<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>HYDRA System Interface</title>
    <!-- Google Fonts for authentic Sci-Fi HUD aesthetics -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f7fe;
            --cyan-glow: #00b4d8;
            --cyan-bright: #00e5ff;
            --cyan-line: #0096c7;
            --cyan-dim: rgba(0, 180, 240, 0.25);
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-primary: #18346b;
            --text-secondary: #2c4d87;
            --text-cyan: #0077b6;
            --hud-scale: 1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-drag: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 48%, rgba(255, 255, 255, 0.95) 0%, rgba(240, 248, 255, 0.6) 45%, rgba(225, 238, 252, 0.85) 100%),
                radial-gradient(circle at 10% 90%, rgba(0, 180, 240, 0.08) 0%, transparent 45%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Share Tech Mono', 'Rajdhani', monospace, sans-serif;
            color: var(--text-primary);
        }

        /* 1024x575 Native Canva Composition Viewport */
        .hud-viewport {
            position: absolute;
            width: 1024px;
            height: 575px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(var(--hud-scale, 1));
            transform-origin: center center;
            overflow: visible;
        }

        /* Visible Futuristic Background Grid in Light Form */
        .bg-grid {
            position: absolute;
            inset: 0;
            width: 1024px;
            height: 575px;
            background-image: 
                linear-gradient(rgba(0, 150, 240, 0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 150, 240, 0.12) 1px, transparent 1px);
            background-size: 50px 50px;
            background-position: 511px 274px;
            z-index: 1;
            pointer-events: none;
        }

        /* Master Full-Canvas 1024x575 Vector Overlays (Exact Canva Paths) */
        .hud-master-svg {
            position: absolute;
            inset: 0;
            width: 1024px;
            height: 575px;
            z-index: 2;
            pointer-events: none;
            overflow: visible;
        }

        /* Coordinate Crosshairs at Exact Canva Nodes */
        .crosshair {
            position: absolute;
            color: rgba(0, 140, 230, 0.65);
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            font-weight: 700;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translate(-50%, -50%);
            z-index: 3;
            pointer-events: none;
            text-shadow: 0 0 6px rgba(0, 180, 240, 0.4);
        }
        .ch-tl { left: 138px; top: 146px; }
        .ch-tr { left: 837px; top: 146px; }
        .ch-bl { left: 138px; top: 412px; }
        .ch-br { left: 837px; top: 412px; }

        /* Outer crosshair nodes touching outer reactor circle */
        .ch-center-left { left: 383px; top: 274px; }
        .ch-center-right { left: 638px; top: 274px; }

        /* ======================================================== */
        /* TOP-LEFT: CLOCK CONTENT                                  */
        /* ======================================================== */
        .clock-content {
            position: absolute;
            left: 20px;
            top: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 20;
            pointer-events: auto;
        }

        .clock-pill {
            width: 3.5px;
            height: 48px;
            background: var(--cyan-glow);
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(0, 180, 240, 0.7);
        }

        .clock-data {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .clock-time {
            font-family: 'Share Tech Mono', monospace;
            font-size: 23px;
            font-weight: 700;
            letter-spacing: 4.5px;
            color: #18346b;
            text-shadow: 0 0 8px rgba(0, 180, 240, 0.25);
            line-height: 1.1;
        }

        .clock-date {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11.5px;
            letter-spacing: 3px;
            color: var(--text-cyan);
            text-transform: uppercase;
            font-weight: 600;
            opacity: 0.95;
        }

        /* ======================================================== */
        /* TOP-RIGHT: SYSTEM ONLINE STATUS CONTENT                  */
        /* ======================================================== */
        .status-content {
            position: absolute;
            left: 884px;
            top: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 20;
            pointer-events: auto;
            white-space: nowrap;
        }

        .status-dot {
            width: 7.5px;
            height: 7.5px;
            background-color: var(--cyan-bright);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--cyan-bright), 0 0 16px rgba(0, 229, 255, 0.7);
            animation: pulse-dot 2.5s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.25); opacity: 0.65; }
        }

        .status-label {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11.5px;
            letter-spacing: 2.5px;
            color: #18346b;
            text-transform: uppercase;
            font-weight: 700;
            white-space: nowrap;
        }

        /* ======================================================== */
        /* MAIN STAGE (Center Reactor + Wings)                      */
        /* ======================================================== */
        .main-stage {
            position: absolute;
            inset: 0;
            width: 1024px;
            height: 575px;
            z-index: 10;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .main-stage.swiped-left {
            transform: translateX(-320px);
        }

        /* Center HUD Cluster at Exact Canva Coordinates (511, 274) */
        .hud-cluster {
            position: absolute;
            left: 511px;
            top: 274px;
            transform: translate(-50%, -50%);
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        /* Rotating circle.png Container */
        .circle-rotating-wrap {
            position: absolute;
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: spin-clockwise 25s linear infinite;
            transform-origin: 140px 140px;
            will-change: transform;
        }

        .circle-image {
            width: 280px;
            height: 280px;
            object-fit: contain;
            border-radius: 50%;
            filter: drop-shadow(0 0 14px rgba(0, 180, 240, 0.35));
            display: block;
            pointer-events: none;
            image-rendering: -webkit-optimize-contrast;
        }

        @keyframes spin-clockwise {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Seamless Stationary Core Center Disc Over circle.png */
        .core-center-disc {
            position: absolute;
            width: 104px;
            height: 104px;
            background: radial-gradient(circle, #ffffff 45%, #f1f7fe 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 15;
            pointer-events: none;
        }

        .core-brand-text {
            font-family: 'Rajdhani', 'Share Tech Mono', sans-serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 5px;
            color: #18346b;
            text-shadow: 0 0 10px rgba(0, 180, 240, 0.2);
            padding-left: 5px;
            user-select: none;
            transition: all 0.3s ease;
        }

        /* Left Wing at Exact Canva Coordinates */
        .wing-left-wrap {
            position: absolute;
            left: 126px;
            top: 257px;
            width: 260px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            pointer-events: none;
            z-index: 5;
        }

        .wing-text {
            font-family: 'Share Tech Mono', monospace;
            font-size: 10.5px;
            letter-spacing: 2px;
            color: #2c4d87;
            text-transform: uppercase;
            margin-bottom: 7px;
            white-space: nowrap;
            font-weight: 700;
        }

        /* SVG Wing lines with chamfer jog */
        .wing-pill-node {
            position: absolute;
            left: 133px;
            top: 277px;
            width: 15px;
            height: 6px;
            background: var(--cyan-bright);
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.8);
            z-index: 6;
            pointer-events: none;
        }

        /* Right Wing at Exact Canva Coordinates */
        .wing-right-wrap {
            position: absolute;
            left: 636px;
            top: 257px;
            width: 251px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            pointer-events: none;
            z-index: 5;
        }

        .wing-right-wrap .wing-text {
            margin-bottom: 7px;
        }

        .wing-dot-node {
            position: absolute;
            left: 852px;
            top: 277px;
            width: 6px;
            height: 6px;
            background: #0963fd;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(9, 99, 253, 0.8);
            z-index: 6;
            pointer-events: none;
        }

        /* ======================================================== */
        /* BOTTOM-LEFT: TELEMETRY CONTENT                           */
        /* ======================================================== */
        .telemetry-card-content {
            position: absolute;
            left: 20px;
            top: 462px;
            width: 180px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            z-index: 20;
        }

        .telemetry-accent-pill {
            width: 3.5px;
            height: 56px;
            background: var(--cyan-glow);
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(0, 180, 240, 0.7);
            margin-top: 2px;
        }

        .telemetry-inner-body {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
        }

        .telemetry-header {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .telemetry-dot {
            width: 6px;
            height: 6px;
            background: var(--cyan-bright);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.8);
        }

        .telemetry-title {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-cyan);
            text-transform: uppercase;
        }

        .telemetry-rows {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .telemetry-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: 'Share Tech Mono', monospace;
            font-size: 10.5px;
            letter-spacing: 1.2px;
        }

        .row-label {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--text-secondary);
            opacity: 0.95;
            font-weight: 600;
        }

        .hud-icon {
            width: 12px;
            height: 12px;
            fill: none;
            stroke: var(--cyan-line);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .row-val {
            color: #18346b;
            font-weight: 700;
            letter-spacing: 1px;
            text-align: right;
            padding-left: 6px;
        }

        /* ======================================================== */
        /* BOTTOM-RIGHT: INTERACTIVE ACTION BUTTON                  */
        /* ======================================================== */
        .action-btn-container {
            position: absolute;
            left: 933px;
            top: 463px;
            width: 56px;
            height: 56px;
            background: #ffffff;
            border-radius: 50%;
            border: 1.5px solid rgba(0, 180, 240, 0.45);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 180, 240, 0.35), 0 4px 12px rgba(27, 49, 100, 0.1);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            overflow: hidden;
            pointer-events: auto;
            z-index: 100;
        }

        .action-neon-arc {
            position: absolute;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: 2.5px solid transparent;
            border-top: 2.5px solid var(--cyan-glow);
            border-right: 2.5px solid var(--cyan-glow);
            box-shadow: 0 0 8px var(--cyan-glow), 0 0 14px rgba(0, 180, 240, 0.5);
            pointer-events: none;
            transform: rotate(20deg);
            transition: opacity 0.3s ease;
        }

        .chat-icon {
            width: 22px;
            height: 22px;
            fill: #18346b;
            transition: transform 0.3s ease, opacity 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .send-icon {
            position: absolute;
            width: 18px;
            height: 18px;
            opacity: 0;
            transform: scale(0.4) rotate(-30deg);
            transition: all 0.3s ease;
            z-index: 2;
        }

        /* Expanded State for Command Entry */
        .action-btn-container.expanded {
            left: auto;
            right: 20px;
            width: 380px;
            border-radius: 26px;
            background: rgba(255, 255, 255, 0.96);
            border-color: var(--cyan-glow);
            box-shadow: 0 0 25px rgba(0, 180, 240, 0.5);
            justify-content: space-between;
            padding: 0 16px 0 20px;
            cursor: default;
        }

        .action-btn-container.expanded .action-neon-arc {
            opacity: 0;
        }

        .action-btn-container.expanded .chat-icon {
            display: none;
        }

        .action-btn-container.expanded .send-icon {
            position: static;
            opacity: 1;
            transform: scale(1) rotate(0deg);
            cursor: pointer;
        }

        .cmd-text-input {
            width: 0;
            opacity: 0;
            border: none;
            background: transparent;
            color: #18346b;
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            outline: none;
            letter-spacing: 1px;
            transition: width 0.35s ease, opacity 0.25s ease;
        }

        .action-btn-container.expanded .cmd-text-input {
            width: 310px;
            opacity: 1;
        }

        /* ======================================================== */
        /* SLIDE-OUT DOSSIER & DEEP DIVE PANELS                     */
        /* ======================================================== */
        .info-panel {
            position: absolute;
            right: 40px;
            top: 60px;
            width: 500px;
            height: 450px;
            opacity: 0;
            pointer-events: none;
            display: flex;
            gap: 20px;
            transition: opacity 0.4s ease-in-out 0.2s;
            z-index: 25;
        }

        .main-stage.swiped-left ~ .info-panel {
            opacity: 1;
            pointer-events: auto;
        }

        .info-left-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
            max-height: 100%;
            padding-right: 6px;
        }
        .info-left-col::-webkit-scrollbar { width: 4px; }
        .info-left-col::-webkit-scrollbar-thumb { background: var(--cyan-dim); border-radius: 2px; }

        .info-card {
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(0, 180, 240, 0.4);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            backdrop-filter: blur(8px);
            color: #18346b;
        }
        .info-card img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid rgba(0, 180, 240, 0.3);
            cursor: pointer;
        }
        .info-card .source-txt {
            font-size: 11px;
            color: var(--text-cyan);
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 1px;
            font-weight: 700;
        }
        .info-card .detail-txt {
            font-size: 12px;
            opacity: 0.95;
            line-height: 1.4;
            color: #18346b;
        }

        .info-right-col {
            flex: 1.2;
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(0, 180, 240, 0.4);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            backdrop-filter: blur(8px);
            color: #18346b;
        }
        .info-right-col h2 {
            font-family: 'Share Tech Mono', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: #18346b;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(0, 180, 240, 0.4);
            padding-bottom: 8px;
        }
        .info-right-col p {
            font-size: 13.5px;
            line-height: 1.6;
            opacity: 0.95;
            color: #2c4d87;
            overflow-y: auto;
        }

        /* Deep Dive HUD (Full Screen) */
        .deep-dive-panel {
            position: absolute;
            inset: 0;
            background: rgba(240, 247, 254, 0.98);
            z-index: 40;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transform: translateX(100%);
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s;
            padding: 40px;
            overflow: hidden;
        }
        .deep-dive-active .deep-dive-panel {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0);
        }
        .deep-dive-active .main-stage,
        .deep-dive-active .clock-content,
        .deep-dive-active .status-content,
        .deep-dive-active .telemetry-card-content,
        .deep-dive-active .action-btn-container,
        .deep-dive-active .hud-master-svg,
        .deep-dive-active .info-panel {
            transform: translateX(-150%) !important;
            opacity: 0;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s;
        }

        .dd-header {
            font-family: 'Share Tech Mono', sans-serif;
            font-size: 30px;
            color: #18346b;
            margin-bottom: 18px;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 2px solid var(--cyan-glow);
            padding-bottom: 8px;
        }
        .dd-content { display: flex; gap: 25px; height: calc(100% - 65px); }
        .dd-images { flex: 0.35; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; overflow-y: auto; align-content: start; }
        .dd-images img { width: 100%; height: 130px; object-fit: cover; border-radius: 6px; border: 1px solid rgba(0, 180, 240, 0.4); cursor: pointer; }
        .dd-text { flex: 0.65; background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(0, 180, 240, 0.4); border-radius: 12px; padding: 22px; overflow-y: auto; line-height: 1.7; font-size: 14.5px; color: #18346b; }
        .dd-text h3 { color: var(--text-cyan); margin-top: 14px; margin-bottom: 6px; font-size: 17px; text-transform: uppercase; }
        .dd-text p { margin-bottom: 10px; color: #2c4d87; }

        /* Lightbox Modal */
        .img-modal {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; z-index: 1000; transition: opacity 0.3s ease;
        }
        .img-modal.active { opacity: 1; pointer-events: auto; }
        .img-modal img { max-width: 90%; max-height: 90%; border: 2px solid var(--cyan-glow); border-radius: 8px; box-shadow: 0 0 25px rgba(0, 180, 240, 0.6); }

        /* Sporadic Glitch Effect on HUD Data */
        .glitch-active {
            position: relative;
        }
        .glitch-active::before, .glitch-active::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
        }
        .glitch-active::before {
            left: 2px;
            text-shadow: -2px 0 rgba(255, 0, 80, 0.7);
            animation: sporadic-glitch-1 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
        }
        .glitch-active::after {
            left: -2px;
            text-shadow: -2px 0 rgba(0, 180, 240, 0.7);
            animation: sporadic-glitch-2 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite reverse;
        }
        @keyframes sporadic-glitch-1 {
            0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 1px); }
            50% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -1px); }
            100% { clip-path: inset(30% 0 50% 0); transform: translate(1px, -1px); }
        }
        @keyframes sporadic-glitch-2 {
            0% { clip-path: inset(10% 0 60% 0); transform: translate(2px, -1px); }
            50% { clip-path: inset(70% 0 10% 0); transform: translate(2px, -2px); }
            100% { clip-path: inset(5% 0 80% 0); transform: translate(-1px, 1px); }
        }
    </style>
</head>
<body>

    <!-- 1024x575 Unified HUD Viewport Matching Canva Pixel Coordinates -->
    <div class="hud-viewport">

        <!-- Background Grid in Light Form -->
        <div class="bg-grid"></div>

        <!-- Master 1024x575 SVG Layer: All Exact Corner Lines, Chamfers, and Slashes -->
        <svg class="hud-master-svg" viewBox="0 0 1024 575">
            <defs>
                <filter id="hudGlow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="1.5" result="blur" />
                    <feMerge>
                        <feMergeNode in="blur" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>
                <linearGradient id="cyanLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#38bdf8" />
                    <stop offset="100%" stop-color="#0096c7" />
                </linearGradient>
                <linearGradient id="blOuterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#9d9eff" />
                    <stop offset="45%" stop-color="#38bdf8" />
                    <stop offset="100%" stop-color="#0096c7" />
                </linearGradient>
                <linearGradient id="brCornerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#00b4d8" />
                    <stop offset="78%" stop-color="#38bdf8" />
                    <stop offset="100%" stop-color="#8d76fa" />
                </linearGradient>
                <linearGradient id="trGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#38bdf8" />
                    <stop offset="75%" stop-color="#0096c7" />
                    <stop offset="100%" stop-color="#8d76fa" />
                </linearGradient>
                <linearGradient id="tlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#0096c7" />
                    <stop offset="70%" stop-color="#38bdf8" />
                    <stop offset="100%" stop-color="#8d76fa" />
                </linearGradient>
                <linearGradient id="rwLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="rgba(0, 160, 240, 0.7)" />
                    <stop offset="100%" stop-color="rgba(141, 118, 250, 0.7)" />
                </linearGradient>
            </defs>

            <!-- ================= TOP-LEFT CLOCK FRAME (Exact Hexagonal HUD Capsule) ================= -->
            <!-- Top line at y=28, chamfers at x=168 down-right, bottom line at y=106, chamfer drop to (0, 142) -->
            <path d="M 12 65 L 12 40 L 24 28 L 168 28 L 180 40 L 180 72 L 146 106 L 36 106 L 0 142" fill="none" stroke="url(#tlGrad)" stroke-width="1.5" />
            <!-- Three slanted slashes /// at the bottom-left chamfer -->
            <g fill="#00b4d8" transform="translate(13, 91) skewX(-32)">
                <rect x="0" y="0" width="3.5" height="7.5" rx="1" filter="url(#hudGlow)"/>
                <rect x="6" y="0" width="3.5" height="7.5" rx="1" filter="url(#hudGlow)"/>
                <rect x="12" y="0" width="3.5" height="7.5" rx="1" filter="url(#hudGlow)"/>
            </g>

            <!-- ================= TOP-RIGHT SYSTEM ONLINE (Exact Hexagonal HUD Capsule) ================= -->
            <path d="M 850 44 L 868 44" fill="none" stroke="url(#trGrad)" stroke-width="1.5" />
            <path d="M 868 44 L 886 26 L 1004 26 L 1014 36 L 1014 58" fill="none" stroke="url(#trGrad)" stroke-width="1.5" />
            <path d="M 868 44 L 886 62 L 1004 62 L 1014 72 L 1014 86 L 1024 96" fill="none" stroke="url(#trGrad)" stroke-width="1.5" />

            <!-- ================= CENTER REACTOR CARDINAL AXES & TICKS ================= -->
            <path d="M 511 138 L 511 168 M 511 378 L 511 408" stroke="#0096c7" stroke-width="1.2" fill="none"/>
            <circle cx="511" cy="151" r="3.5" fill="#0077b6"/>
            <circle cx="511" cy="400" r="3.5" fill="#0077b6"/>
            <circle cx="383" cy="274" r="3.5" fill="#0077b6"/>
            <circle cx="638" cy="274" r="3.5" fill="#0077b6"/>

            <!-- ================= WINGS SVG PATHS WITH EXACT CHAMFER JOG ================= -->
            <path d="M 126 280 L 336 280 L 346 274 L 383 274" stroke="rgba(0, 160, 240, 0.7)" stroke-width="1.5" fill="none"/>
            <path d="M 638 274 L 677 274 L 687 280 L 887 280" stroke="url(#rwLineGrad)" stroke-width="1.5" fill="none"/>

            <!-- ================= BOTTOM-LEFT TELEMETRY FRAME (Exact Canva Paths) ================= -->
            <!-- Outer corner baseline: starts at (0, 400), down to (12, 532), chamfer to (24, 544), baseline to (245, 544), step up to (305, 536) -->
            <path d="M 0 400 L 12 412 L 12 532 L 24 544 L 245 544 L 253 536 L 305 536" fill="none" stroke="url(#blOuterGrad)" stroke-width="1.5" />
            <!-- Telemetry card frame: top line at y=442, chamfer down to y=462, diagonal down to baseline -->
            <path d="M 24 452 L 34 442 L 160 442 L 178 460 L 246 460 L 320 534 L 330 544" fill="none" stroke="#00b4d8" stroke-width="1.5" />
            <path d="M 24 452 L 24 516 L 34 526 L 110 526" fill="none" stroke="#00b4d8" stroke-width="1.5" />
            
            <!-- Three slashes /// at the bottom right of telemetry card -->
            <g fill="#00b4d8" transform="translate(225, 537) skewX(-32)">
                <rect x="0" y="0" width="3.5" height="7.5" rx="1" filter="url(#hudGlow)"/>
                <rect x="6.5" y="0" width="3.5" height="7.5" rx="1" filter="url(#hudGlow)"/>
                <rect x="13" y="0" width="3.5" height="7.5" rx="1" filter="url(#hudGlow)"/>
            </g>

            <!-- ================= BOTTOM-RIGHT BRACKET & ACTION BUTTON RING ================= -->
            <!-- Outer baseline and chamfer corner -->
            <path d="M 775 547 L 785 539 L 880 539 L 880 542 L 1004 542 L 1014 532 L 1014 480 L 1010 476 L 1010 460 L 1024 446" fill="none" stroke="url(#brCornerGrad)" stroke-width="1.5" />
            <!-- Three slanted slashes /// on the horizontal baseline -->
            <g fill="#00b4d8" transform="translate(865, 533) skewX(-32)">
                <rect x="0" y="0" width="3.5" height="7.5" rx="1" filter="url(#hudGlow)"/>
                <rect x="6.5" y="0" width="3.5" height="7.5" rx="1" filter="url(#hudGlow)"/>
                <rect x="13" y="0" width="3.5" height="7.5" rx="1" filter="url(#hudGlow)"/>
            </g>
            <!-- Delicate Outer Circle Ring around Action Button -->
            <circle cx="961" cy="491" r="35" fill="none" stroke="rgba(0, 180, 240, 0.35)" stroke-width="1.2"/>
            <path d="M 961 456 A 35 35 0 0 1 996 491" fill="none" stroke="#00e5ff" stroke-width="2.2" filter="url(#hudGlow)"/>
        </svg>

        <!-- Four Coordinate Crosshairs '+' -->
        <div class="crosshair ch-tl">+</div>
        <div class="crosshair ch-tr">+</div>
        <div class="crosshair ch-bl">+</div>
        <div class="crosshair ch-br">+</div>

        <!-- Outer Crosshairs touching reactor perimeter -->
        <div class="crosshair ch-center-left">+</div>
        <div class="crosshair ch-center-right">+</div>

        <!-- Top-Left Clock Content -->
        <div class="clock-content">
            <div class="clock-pill"></div>
            <div class="clock-data target-glitch">
                <div id="hudTime" class="clock-time" data-text="--:--:--">--:--:--</div>
                <div id="hudDate" class="clock-date" data-text="-- --- ----">-- --- ----</div>
            </div>
        </div>

        <!-- Top-Right System Online Status Content -->
        <div class="status-content">
            <div class="status-dot"></div>
            <span class="status-label">SYSTEM ONLINE</span>
        </div>

        <!-- Main Stage (Center Reactor + Wings) -->
        <div class="main-stage">
            
            <!-- Left Wing Text -->
            <div class="wing-left-wrap">
                <div class="wing-text">THINK &nbsp;/&nbsp; ANALYZE &nbsp;/&nbsp; EXECUTE</div>
            </div>
            <!-- Pill Node on Left Wing -->
            <div class="wing-pill-node"></div>

            <!-- Center Rotating HUD Reactor (Using circle.png at 511, 274) -->
            <div class="hud-cluster">
                <div class="circle-rotating-wrap">
                    <img src="circle.png" class="circle-image" alt="HYDRA Core">
                </div>
                <div class="core-center-disc">
                    <h1 class="core-brand-text" id="coreTitle">HYDRA</h1>
                </div>
            </div>

            <!-- Right Wing Text -->
            <div class="wing-right-wrap">
                <div class="wing-text">YOUR AI ASSISTANT</div>
            </div>
            <!-- Dot Node on Right Wing -->
            <div class="wing-dot-node"></div>

        </div>

        <!-- Bottom-Left Telemetry Card Content -->
        <div class="telemetry-card-content target-glitch">
            <div class="telemetry-accent-pill"></div>
            <div class="telemetry-inner-body">
                <div class="telemetry-header">
                    <div class="telemetry-dot"></div>
                    <span id="hudNetStatus" class="telemetry-title" data-text="ONLINE">ONLINE</span>
                </div>
                <div class="telemetry-rows">
                    <div class="telemetry-row">
                        <div class="row-label">
                            <svg class="hud-icon" viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1"/></svg>
                            <span>NETWORK</span>
                        </div>
                        <span id="hudSSID" class="row-val" data-text="Connected">Connected</span>
                    </div>
                    <div class="telemetry-row">
                        <div class="row-label">
                            <svg class="hud-icon" viewBox="0 0 24 24"><line x1="6" y1="20" x2="6" y2="16"/><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/></svg>
                            <span>SIGNAL</span>
                        </div>
                        <span id="hudSignal" class="row-val" data-text="Good">Good</span>
                    </div>
                    <div class="telemetry-row">
                        <div class="row-label">
                            <svg class="hud-icon" viewBox="0 0 24 24"><line x1="7" y1="18" x2="7" y2="6"/><polyline points="3 10 7 6 11 10"/><line x1="17" y1="6" x2="17" y2="18"/><polyline points="13 14 17 18 21 14"/></svg>
                            <span>RATE</span>
                        </div>
                        <span id="hudSpeed" class="row-val" data-text="43.2 KB/s">43.2 KB/s</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom-Right Action Button -->
        <div class="action-btn-container" id="containerBtn">
            <div class="action-neon-arc"></div>
            
            <input type="text" class="cmd-text-input" id="cmdInput" placeholder="Enter system command..." autocomplete="off">

            <!-- Chat Bubble Icon with cutout lines matching Canva -->
            <svg class="chat-icon" id="iconAction" viewBox="0 0 24 24">
                <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
                <line x1="7" y1="8" x2="15" y2="8" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
                <line x1="7" y1="12" x2="17" y2="12" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
            </svg>

            <!-- Send Icon -->
            <svg class="send-icon" id="btnSend" viewBox="0 0 24 24">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" fill="#00b4d8"/>
            </svg>
        </div>

        <!-- Quick Info Slide-out Panel (Compatible with main.py) -->
        <div class="info-panel" id="infoPanel">
            <div class="info-left-col" id="infoLeftCol"></div>
            <div class="info-right-col">
                <h2 id="infoTitle">Intelligence Intel</h2>
                <p id="infoDescription">Awaiting query parameters...</p>
            </div>
        </div>

        <!-- Full-Screen Deep Dive Panel (Compatible with main.py) -->
        <div class="deep-dive-panel" id="deepDivePanel">
            <div class="dd-header" id="ddTitle">Target Deep Dive</div>
            <div class="dd-content">
                <div class="dd-images" id="ddImages"></div>
                <div class="dd-text" id="ddText">Processing deeper context...</div>
            </div>
        </div>

    </div>

    <!-- Full-Screen Lightbox Modal -->
    <div class="img-modal" id="imgModal" onclick="closeImageModal()">
        <img id="modalImg" src="" alt="Expanded View" onclick="event.stopPropagation();">
    </div>

    <script>
        // Automatic Dynamic Scaling to Maintain Exact Proportions on ANY Screen
        function resizeHUD() {
            const scale = Math.min(window.innerWidth / 1024, window.innerHeight / 575);
            document.documentElement.style.setProperty('--hud-scale', scale);
        }
        window.addEventListener('resize', resizeHUD);
        resizeHUD();

        const containerBtn = document.getElementById('containerBtn');
        const cmdInput = document.getElementById('cmdInput');
        const iconAction = document.getElementById('iconAction');
        const btnSend = document.getElementById('btnSend');

        containerBtn.addEventListener('click', function(e) {
            if (!containerBtn.classList.contains('expanded')) {
                containerBtn.classList.add('expanded');
                cmdInput.focus();
            }
        });

        btnSend.addEventListener('click', function(e) {
            e.stopPropagation();
            submitCommand();
        });

        cmdInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                submitCommand();
            } else if (e.key === 'Escape') {
                cmdInput.value = '';
                containerBtn.classList.remove('expanded');
                cmdInput.blur();
            }
        });

        function submitCommand() {
            const command = cmdInput.value.trim();
            if (command) {
                console.log("HYDRA_CMD:" + command);
                cmdInput.value = '';
                containerBtn.classList.remove('expanded');
                cmdInput.blur();
            }
        }

        function setCoreText(text) {
            const coreEl = document.getElementById('coreTitle');
            if (coreEl) {
                coreEl.innerText = text;
            }
        }
        
        function updateHUD() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase();
            const timeStr = now.toLocaleTimeString('en-GB', { hour12: false });
            
            const hudTime = document.getElementById('hudTime');
            const hudDate = document.getElementById('hudDate');
            
            if (hudTime) {
                hudTime.innerText = timeStr;
                hudTime.setAttribute('data-text', timeStr);
            }
            if (hudDate) {
                hudDate.innerText = dateStr;
                hudDate.setAttribute('data-text', dateStr);
            }
        }
        
        function updateRealNetwork(ssid, signal, speed) {
            const isOnline = ssid !== 'DISCONNECTED';
            const hudNetStatus = document.getElementById('hudNetStatus');
            const hudSSID = document.getElementById('hudSSID');
            const hudSignal = document.getElementById('hudSignal');
            const hudSpeed = document.getElementById('hudSpeed');

            if (hudNetStatus) {
                hudNetStatus.innerText = isOnline ? 'ONLINE' : 'OFFLINE';
                hudNetStatus.setAttribute('data-text', hudNetStatus.innerText);
            }
            if (hudSSID) {
                hudSSID.innerText = ssid;
                hudSSID.setAttribute('data-text', ssid);
            }
            if (hudSignal) {
                hudSignal.innerText = signal;
                hudSignal.setAttribute('data-text', signal);
            }
            if (hudSpeed) {
                hudSpeed.innerText = speed;
                hudSpeed.setAttribute('data-text', speed);
            }
        }
        
        setInterval(updateHUD, 1000);
        updateHUD();

        // Sporadic Glitch Effect Every 12 Seconds
        setInterval(() => {
            const elements = document.querySelectorAll('.target-glitch > div, .target-glitch span');
            elements.forEach(el => el.classList.add('glitch-active'));
            setTimeout(() => {
                elements.forEach(el => el.classList.remove('glitch-active'));
            }, 350);
        }, 12000);

        function triggerScreenSwipe(active) {
            const stage = document.querySelector('.main-stage');
            if (stage) stage.classList.toggle('swiped-left', active);
        }

        function populateInfoHUD(title, text, items) {
            document.body.classList.remove('deep-dive-active');
            setTimeout(() => {
                document.getElementById('infoTitle').innerText = title;
                document.getElementById('infoDescription').innerText = text;
                const leftCol = document.getElementById('infoLeftCol');
                leftCol.innerHTML = '';
                items.forEach(item => {
                    let imgSrc = item.img ? item.img : 'circle.png';
                    leftCol.innerHTML += `
                        <div class="info-card">
                            <img src="${imgSrc}" alt="Preview" onerror="this.onerror=null; this.src='circle.png';" onclick="openImageModal(this.src)">
                            <div class="source-txt">${item.source || 'HYDRA ARCHIVE'}</div>
                            <div class="detail-txt">${item.desc}</div>
                        </div>`;
                });
                triggerScreenSwipe(true);
            }, 300); 
        }

        function resetScreenSwipe() {
            document.body.classList.remove('deep-dive-active');
            triggerScreenSwipe(false);
        }

        function openImageModal(src) {
            if (src.includes('circle.png')) return;
            document.getElementById('modalImg').src = src;
            document.getElementById('imgModal').classList.add('active');
        }

        function closeImageModal() {
            document.getElementById('imgModal').classList.remove('active');
        }

        function openDeepDiveHUD(title, htmlContent, imagesList) {
            document.getElementById('ddTitle').innerText = title;
            document.getElementById('ddText').innerHTML = htmlContent;
            
            const imgContainer = document.getElementById('ddImages');
            imgContainer.innerHTML = '';
            imagesList.forEach(src => {
                if (src && !src.includes('circle.png')) {
                    imgContainer.innerHTML += `<img src="${src}" onclick="openImageModal(this.src)" onerror="this.style.display='none'">`;
                }
            });

            document.body.classList.add('deep-dive-active');
        }
    </script>
</body>
</html>
