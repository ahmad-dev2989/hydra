<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>HYDRA System Interface</title>
    <!-- Google Fonts for authentic Sci-Fi HUD aesthetics -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000e18;
            --cyan-glow: #00e5ff;
            --cyan-line: #00d8f6;
            --cyan-dim: rgba(0, 216, 246, 0.4);
            --card-bg: rgba(1, 14, 23, 0.9);
            --text-primary: #ffffff;
            --text-cyan: #00d8f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-drag: none;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at center, rgba(0, 42, 65, 0.3) 0%, transparent 70%),
                radial-gradient(circle at 12% 88%, rgba(0, 180, 216, 0.06) 0%, transparent 45%);
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Share Tech Mono', 'Rajdhani', monospace, sans-serif;
            overflow: hidden;
            color: var(--text-primary);
            position: relative;
        }

        /* Subtle Background Grid */
        .bg-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 216, 246, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 216, 246, 0.045) 1px, transparent 1px);
            background-size: 50px 50px;
            background-position: center;
            z-index: 1;
            pointer-events: none;
        }

        /* Coordinate Crosshairs at Key Quadrant Nodes */
        .crosshair {
            position: absolute;
            width: 12px;
            height: 12px;
            color: rgba(0, 216, 246, 0.35);
            font-family: 'Share Tech Mono', monospace;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            pointer-events: none;
        }
        .ch-tl { top: 24%; left: 14%; }
        .ch-tr { top: 24%; right: 18%; }
        .ch-bl { bottom: 27%; left: 14%; }
        .ch-br { bottom: 27%; right: 18%; }

        /* Shared SVG Glow Filters */
        .hud-filter-svg {
            position: absolute;
            width: 0;
            height: 0;
            pointer-events: none;
        }

        /* ======================================================== */
        /* TOP-LEFT: TIME & DATE HUD WIDGET                         */
        /* ======================================================== */
        .hud-clock-widget {
            position: absolute;
            top: 25px;
            left: 20px;
            width: 260px;
            height: 90px;
            z-index: 20;
            pointer-events: none;
        }

        .clock-frame-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .clock-content {
            position: absolute;
            top: 14px;
            left: 32px;
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
        }

        .clock-pill {
            width: 3.5px;
            height: 40px;
            background: var(--cyan-glow);
            border-radius: 2px;
            box-shadow: 0 0 10px var(--cyan-glow), 0 0 16px rgba(0, 229, 255, 0.5);
        }

        .clock-data {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .clock-time {
            font-family: 'Share Tech Mono', monospace;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 4.5px;
            color: #ffffff;
            text-shadow: 0 0 10px var(--cyan-glow), 0 0 20px rgba(0, 229, 255, 0.4);
            line-height: 1.1;
        }

        .clock-date {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--text-cyan);
            text-transform: uppercase;
            opacity: 0.9;
        }

        /* ======================================================== */
        /* TOP-RIGHT: SYSTEM ONLINE STATUS WIDGET                   */
        /* ======================================================== */
        .hud-status-widget {
            position: absolute;
            top: 25px;
            right: 24px;
            width: 200px;
            height: 55px;
            z-index: 20;
            pointer-events: none;
        }

        .status-frame-svg {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .status-content {
            position: absolute;
            top: 16px;
            right: 24px;
            display: flex;
            align-items: center;
            gap: 9px;
            pointer-events: auto;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: var(--cyan-glow);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--cyan-glow), 0 0 14px var(--cyan-glow);
            animation: pulse-dot 2.5s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.25); opacity: 0.65; }
        }

        .status-label {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11.5px;
            letter-spacing: 2.5px;
            color: var(--text-cyan);
            text-transform: uppercase;
            text-shadow: 0 0 6px rgba(0, 216, 246, 0.5);
        }

        /* ======================================================== */
        /* MAIN STAGE (Center Reactor + Wings)                      */
        /* ======================================================== */
        .main-stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 15;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .main-stage.swiped-left {
            transform: translateX(-30vw);
        }

        /* Center HUD Cluster */
        .hud-cluster {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        /* Rotating circle.png Container */
        .circle-rotating-wrap {
            position: absolute;
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: spin-clockwise 25s linear infinite;
            transform-origin: 140px 140px;
            will-change: transform;
        }

        .circle-image {
            width: 280px;
            height: 280px;
            object-fit: contain;
            border-radius: 50%;
            -webkit-mask-image: radial-gradient(circle, black 65%, black 97%, transparent 100%);
            mask-image: radial-gradient(circle, black 65%, black 97%, transparent 100%);
            filter: drop-shadow(0 0 16px rgba(0, 229, 255, 0.4));
            display: block;
            pointer-events: none;
            image-rendering: -webkit-optimize-contrast;
        }

        @keyframes spin-clockwise {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Stationary Core Center Disc Over circle.png (Seamless, No Border) */
        .core-center-disc {
            position: absolute;
            width: 82px;
            height: 82px;
            background: #000e18;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 15;
            pointer-events: none;
        }

        .core-brand-text {
            font-family: 'Rajdhani', 'Share Tech Mono', sans-serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 5px;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
            padding-left: 5px;
            user-select: none;
            transition: all 0.3s ease;
        }

        /* Horizontal Wings Aligned to Reactor Center */
        .hud-wing {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            pointer-events: none;
            z-index: 5;
        }

        .wing-left {
            right: calc(50% + 152px);
            align-items: flex-start;
        }

        .wing-right {
            left: calc(50% + 152px);
            align-items: flex-end;
        }

        .wing-text {
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--text-cyan);
            text-transform: uppercase;
            margin-bottom: 6px;
            white-space: nowrap;
            text-shadow: 0 0 6px rgba(0, 216, 246, 0.5);
        }

        .wing-line-bar {
            width: 170px;
            height: 1px;
            background: rgba(0, 216, 246, 0.5);
            position: relative;
        }

        .wing-left .wing-pill-node {
            position: absolute;
            left: 10px;
            top: -2px;
            width: 14px;
            height: 4px;
            background: var(--cyan-glow);
            border-radius: 2px;
            box-shadow: 0 0 6px var(--cyan-glow);
        }

        .wing-left .wing-end-dot {
            position: absolute;
            right: 0;
            top: -1.5px;
            width: 3px;
            height: 3px;
            background: var(--cyan-glow);
            border-radius: 50%;
        }

        .wing-right .wing-line-bar {
            width: 150px;
        }

        .wing-right .wing-dot-node {
            position: absolute;
            right: 28px;
            top: -2px;
            width: 4.5px;
            height: 4.5px;
            background: var(--cyan-glow);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--cyan-glow);
        }

        .wing-right .wing-start-dot {
            position: absolute;
            left: 0;
            top: -1.5px;
            width: 3px;
            height: 3px;
            background: var(--cyan-glow);
            border-radius: 50%;
        }

        /* ======================================================== */
        /* BOTTOM-LEFT: TELEMETRY CARD                              */
        /* ======================================================== */
        .hud-telemetry-widget {
            position: absolute;
            bottom: 24px;
            left: 20px;
            width: 250px;
            height: 130px;
            z-index: 20;
        }

        .telemetry-frame-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
            pointer-events: none;
        }

        .telemetry-card-content {
            position: absolute;
            top: 24px;
            left: 22px;
            width: 165px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .telemetry-accent-pill {
            width: 3px;
            height: 52px;
            background: var(--cyan-glow);
            border-radius: 2px;
            box-shadow: 0 0 8px var(--cyan-glow);
            margin-top: 2px;
        }

        .telemetry-inner-body {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
        }

        .telemetry-header {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .telemetry-dot {
            width: 6px;
            height: 6px;
            background: var(--cyan-glow);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--cyan-glow);
        }

        .telemetry-title {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-cyan);
            text-transform: uppercase;
        }

        .telemetry-rows {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .telemetry-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: 'Share Tech Mono', monospace;
            font-size: 10.5px;
            letter-spacing: 1.2px;
        }

        .row-label {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--text-cyan);
            opacity: 0.9;
        }

        .hud-icon {
            width: 12px;
            height: 12px;
            fill: none;
            stroke: var(--cyan-glow);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .row-val {
            color: #ffffff;
            font-weight: 600;
            letter-spacing: 1px;
            text-align: right;
            padding-left: 6px;
        }

        /* ======================================================== */
        /* BOTTOM-RIGHT: INTERACTIVE ACTION BUTTON                  */
        /* ======================================================== */
        .hud-action-widget {
            position: absolute;
            bottom: 24px;
            right: 24px;
            width: 200px;
            height: 100px;
            z-index: 100;
            pointer-events: none;
        }

        .action-frame-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .action-btn-container {
            position: absolute;
            bottom: 12px;
            right: 18px;
            width: 48px;
            height: 48px;
            background: #02141f;
            border-radius: 50%;
            border: 1.5px solid rgba(0, 216, 246, 0.45);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 16px rgba(0, 229, 255, 0.35);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            overflow: hidden;
            pointer-events: auto;
        }

        .action-neon-arc {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2.5px solid transparent;
            border-top: 2.5px solid var(--cyan-glow);
            border-right: 2.5px solid var(--cyan-glow);
            box-shadow: 0 0 8px var(--cyan-glow), 0 0 14px rgba(0, 229, 255, 0.5);
            pointer-events: none;
            transform: rotate(20deg);
            transition: opacity 0.3s ease;
        }

        .chat-icon {
            width: 18px;
            height: 18px;
            fill: #ffffff;
            transition: transform 0.3s ease, opacity 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .send-icon {
            position: absolute;
            width: 18px;
            height: 18px;
            opacity: 0;
            transform: scale(0.4) rotate(-30deg);
            transition: all 0.3s ease;
            z-index: 2;
        }

        /* Expanded State for Command Entry */
        .action-btn-container.expanded {
            width: 380px;
            border-radius: 24px;
            background: rgba(2, 20, 31, 0.95);
            border-color: var(--cyan-glow);
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.5);
            justify-content: space-between;
            padding: 0 16px 0 20px;
            cursor: default;
        }

        .action-btn-container.expanded .action-neon-arc {
            opacity: 0;
        }

        .action-btn-container.expanded .chat-icon {
            display: none;
        }

        .action-btn-container.expanded .send-icon {
            position: static;
            opacity: 1;
            transform: scale(1) rotate(0deg);
            cursor: pointer;
        }

        .cmd-text-input {
            width: 0;
            opacity: 0;
            border: none;
            background: transparent;
            color: #ffffff;
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            outline: none;
            letter-spacing: 1px;
            transition: width 0.35s ease, opacity 0.25s ease;
        }

        .action-btn-container.expanded .cmd-text-input {
            width: 310px;
            opacity: 1;
        }

        /* ======================================================== */
        /* SLIDE-OUT DOSSIER & DEEP DIVE PANELS                     */
        /* ======================================================== */
        .info-panel {
            position: absolute;
            right: 4vw;
            top: 10vh;
            width: 50vw;
            height: 80vh;
            opacity: 0;
            pointer-events: none;
            display: flex;
            gap: 24px;
            transition: opacity 0.4s ease-in-out 0.2s;
            z-index: 25;
        }

        .main-stage.swiped-left ~ .info-panel {
            opacity: 1;
            pointer-events: auto;
        }

        .info-left-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            max-height: 100%;
            padding-right: 8px;
        }
        .info-left-col::-webkit-scrollbar { width: 4px; }
        .info-left-col::-webkit-scrollbar-thumb { background: var(--cyan-dim); border-radius: 2px; }

        .info-card {
            background: rgba(2, 18, 28, 0.85);
            border: 1px solid rgba(0, 216, 246, 0.4);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            backdrop-filter: blur(8px);
        }
        .info-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid rgba(0, 229, 255, 0.3);
            cursor: pointer;
        }
        .info-card .source-txt {
            font-size: 11px;
            color: var(--cyan-glow);
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 1px;
        }
        .info-card .detail-txt {
            font-size: 13px;
            opacity: 0.9;
            line-height: 1.4;
        }

        .info-right-col {
            flex: 1.2;
            background: rgba(2, 18, 28, 0.85);
            border: 1px solid rgba(0, 216, 246, 0.4);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            backdrop-filter: blur(8px);
        }
        .info-right-col h2 {
            font-family: 'Share Tech Mono', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(0, 216, 246, 0.4);
            padding-bottom: 10px;
        }
        .info-right-col p {
            font-size: 14px;
            line-height: 1.6;
            opacity: 0.9;
            overflow-y: auto;
        }

        /* Deep Dive HUD (Full Screen) */
        .deep-dive-panel {
            position: absolute;
            inset: 0;
            background: rgba(2, 9, 14, 0.98);
            z-index: 40;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transform: translateX(100vw);
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s;
            padding: 40px;
            overflow: hidden;
        }
        .deep-dive-active .deep-dive-panel {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0);
        }
        .deep-dive-active .main-stage,
        .deep-dive-active .hud-clock-widget,
        .deep-dive-active .hud-status-widget,
        .deep-dive-active .hud-telemetry-widget,
        .deep-dive-active .hud-action-widget,
        .deep-dive-active .info-panel {
            transform: translateX(-150vw) !important;
            opacity: 0;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s;
        }

        .dd-header {
            font-family: 'Share Tech Mono', sans-serif;
            font-size: 32px;
            color: #ffffff;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 2px solid var(--cyan-glow);
            padding-bottom: 10px;
        }
        .dd-content { display: flex; gap: 30px; height: calc(100% - 70px); }
        .dd-images { flex: 0.35; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; overflow-y: auto; align-content: start; }
        .dd-images img { width: 100%; height: 150px; object-fit: cover; border-radius: 6px; border: 1px solid rgba(0, 216, 246, 0.4); cursor: pointer; }
        .dd-text { flex: 0.65; background: rgba(2, 18, 28, 0.85); border: 1px solid rgba(0, 216, 246, 0.4); border-radius: 12px; padding: 25px; overflow-y: auto; line-height: 1.7; font-size: 15px; }
        .dd-text h3 { color: var(--cyan-glow); margin-top: 15px; margin-bottom: 8px; font-size: 18px; text-transform: uppercase; }
        .dd-text p { margin-bottom: 12px; }

        /* Lightbox Modal */
        .img-modal {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; z-index: 1000; transition: opacity 0.3s ease;
        }
        .img-modal.active { opacity: 1; pointer-events: auto; }
        .img-modal img { max-width: 90%; max-height: 90%; border: 2px solid var(--cyan-glow); border-radius: 8px; box-shadow: 0 0 25px rgba(0, 229, 255, 0.6); }

        /* Sporadic Glitch Effect on HUD Data */
        .glitch-active {
            position: relative;
        }
        .glitch-active::before, .glitch-active::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
        }
        .glitch-active::before {
            left: 2px;
            text-shadow: -2px 0 rgba(255, 0, 80, 0.8);
            animation: sporadic-glitch-1 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
        }
        .glitch-active::after {
            left: -2px;
            text-shadow: -2px 0 rgba(0, 229, 255, 0.8);
            animation: sporadic-glitch-2 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite reverse;
        }
        @keyframes sporadic-glitch-1 {
            0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 1px); }
            50% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -1px); }
            100% { clip-path: inset(30% 0 50% 0); transform: translate(1px, -1px); }
        }
        @keyframes sporadic-glitch-2 {
            0% { clip-path: inset(10% 0 60% 0); transform: translate(2px, -1px); }
            50% { clip-path: inset(70% 0 10% 0); transform: translate(2px, -2px); }
            100% { clip-path: inset(5% 0 80% 0); transform: translate(-1px, 1px); }
        }
    </style>
</head>
<body>

    <!-- Subtle Background Grid -->
    <div class="bg-grid"></div>

    <!-- Coordinate Crosshairs at Key Grid Nodes -->
    <div class="crosshair ch-tl">+</div>
    <div class="crosshair ch-tr">+</div>
    <div class="crosshair ch-bl">+</div>
    <div class="crosshair ch-br">+</div>

    <!-- Hidden Filter Definitions for SVG glows -->
    <svg class="hud-filter-svg">
        <defs>
            <filter id="hudGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="2" result="blur" />
                <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>
        </defs>
    </svg>

    <!-- ======================================================== -->
    <!-- TOP-LEFT: TIME & DATE HUD WIDGET                         -->
    <!-- ======================================================== -->
    <div class="hud-clock-widget">
        <svg class="clock-frame-svg" viewBox="0 0 260 90">
            <!-- Clock card inner border: top line, chamfer down-right, step right -->
            <path d="M 20 8 L 160 8 L 172 20 L 185 20" fill="none" stroke="rgba(0, 216, 246, 0.7)" stroke-width="1.5" />
            <!-- Bottom line: horizontal under date, chamfer up-right -->
            <path d="M 20 58 L 145 58 L 157 46" fill="none" stroke="rgba(0, 216, 246, 0.7)" stroke-width="1.5" />
            <!-- Left border -->
            <path d="M 20 8 L 20 58" fill="none" stroke="rgba(0, 216, 246, 0.7)" stroke-width="1.5" />
            
            <!-- Outer corner bracket with chamfer and 3 slanted slashes /// -->
            <path d="M 6 42 L 6 62 L 16 72 L 42 72" fill="none" stroke="rgba(0, 216, 246, 0.55)" stroke-width="1.5" />
            
            <!-- Three slashes /// at the bottom-left chamfer -->
            <g fill="#00e5ff" transform="translate(6, 60) skewX(-32)">
                <rect x="0" y="0" width="3" height="7.5" rx="1" filter="url(#hudGlow)"/>
                <rect x="5" y="0" width="3" height="7.5" rx="1" filter="url(#hudGlow)"/>
                <rect x="10" y="0" width="3" height="7.5" rx="1" filter="url(#hudGlow)"/>
            </g>
        </svg>
        <div class="clock-content">
            <div class="clock-pill"></div>
            <div class="clock-data target-glitch">
                <div id="hudTime" class="clock-time" data-text="--:--:--">--:--:--</div>
                <div id="hudDate" class="clock-date" data-text="-- --- ----">-- --- ----</div>
            </div>
        </div>
    </div>

    <!-- ======================================================== -->
    <!-- TOP-RIGHT: SYSTEM ONLINE STATUS WIDGET                   -->
    <!-- ======================================================== -->
    <div class="hud-status-widget">
        <svg class="status-frame-svg" viewBox="0 0 200 55">
            <!-- Top line, 45-deg chamfer down-right, vertical down, small inward notch -->
            <path d="M 10 10 L 165 10 L 178 23 L 178 46 L 175 46" fill="none" stroke="rgba(0, 216, 246, 0.7)" stroke-width="1.5" />
        </svg>
        <div class="status-content">
            <div class="status-dot"></div>
            <span class="status-label">SYSTEM ONLINE</span>
        </div>
    </div>

    <!-- ======================================================== -->
    <!-- MAIN STAGE (Center Reactor + Wings)                      -->
    <!-- ======================================================== -->
    <div class="main-stage">
        
        <!-- Left Wing: THINK / ANALYZE / EXECUTE -->
        <div class="hud-wing wing-left">
            <div class="wing-text">THINK &nbsp;/&nbsp; ANALYZE &nbsp;/&nbsp; EXECUTE</div>
            <div class="wing-line-bar">
                <div class="wing-pill-node"></div>
                <div class="wing-end-dot"></div>
            </div>
        </div>

        <!-- Center Rotating HUD Reactor (Using circle.png) -->
        <div class="hud-cluster">
            <div class="circle-rotating-wrap">
                <img src="circle.png" class="circle-image" alt="HYDRA Core">
            </div>
            <div class="core-center-disc">
                <h1 class="core-brand-text" id="coreTitle">HYDRA</h1>
            </div>
        </div>

        <!-- Right Wing: YOUR AI ASSISTANT -->
        <div class="hud-wing wing-right">
            <div class="wing-text">YOUR AI ASSISTANT</div>
            <div class="wing-line-bar">
                <div class="wing-dot-node"></div>
                <div class="wing-start-dot"></div>
            </div>
        </div>

    </div>

    <!-- ======================================================== -->
    <!-- BOTTOM-LEFT: TELEMETRY CARD                              -->
    <!-- ======================================================== -->
    <div class="hud-telemetry-widget">
        <svg class="telemetry-frame-svg" viewBox="0 0 250 130">
            <!-- Outer bottom-left corner line with 45-deg chamfers -->
            <path d="M 0 12 L 5 18 L 5 108 L 15 118 L 135 118" fill="none" stroke="rgba(0, 216, 246, 0.45)" stroke-width="1.5" />
            
            <!-- Card frame outline with chamfers -->
            <!-- Top line at y=16 going across above ONLINE, then chamfers down-right -->
            <path d="M 14 16 L 96 16 L 108 28 L 140 28 L 148 36 L 148 58 L 186 96 L 196 96" fill="none" stroke="rgba(0, 216, 246, 0.7)" stroke-width="1.5" />
            <path d="M 14 16 L 14 96 L 145 96" fill="none" stroke="rgba(0, 216, 246, 0.7)" stroke-width="1.5" />

            <!-- Three slashes /// at the bottom right chamfer -->
            <g fill="#00e5ff" transform="translate(148, 95) skewX(-32)">
                <rect x="0" y="0" width="3" height="6.5" rx="1" filter="url(#hudGlow)"/>
                <rect x="5.5" y="0" width="3" height="6.5" rx="1" filter="url(#hudGlow)"/>
                <rect x="11" y="0" width="3" height="6.5" rx="1" filter="url(#hudGlow)"/>
            </g>
        </svg>
        <div class="telemetry-card-content target-glitch">
            <div class="telemetry-accent-pill"></div>
            <div class="telemetry-inner-body">
                <div class="telemetry-header">
                    <div class="telemetry-dot"></div>
                    <span id="hudNetStatus" class="telemetry-title" data-text="ONLINE">ONLINE</span>
                </div>
                <div class="telemetry-rows">
                    <div class="telemetry-row">
                        <div class="row-label">
                            <svg class="hud-icon" viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1"/></svg>
                            <span>NETWORK</span>
                        </div>
                        <span id="hudSSID" class="row-val" data-text="Connected">Connected</span>
                    </div>
                    <div class="telemetry-row">
                        <div class="row-label">
                            <svg class="hud-icon" viewBox="0 0 24 24"><line x1="6" y1="20" x2="6" y2="16"/><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/></svg>
                            <span>SIGNAL</span>
                        </div>
                        <span id="hudSignal" class="row-val" data-text="Good">Good</span>
                    </div>
                    <div class="telemetry-row">
                        <div class="row-label">
                            <svg class="hud-icon" viewBox="0 0 24 24"><line x1="7" y1="18" x2="7" y2="6"/><polyline points="3 10 7 6 11 10"/><line x1="17" y1="6" x2="17" y2="18"/><polyline points="13 14 17 18 21 14"/></svg>
                            <span>RATE</span>
                        </div>
                        <span id="hudSpeed" class="row-val" data-text="43.2 KB/s">43.2 KB/s</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ======================================================== -->
    <!-- BOTTOM-RIGHT: INTERACTIVE ACTION BUTTON                  -->
    <!-- ======================================================== -->
    <div class="hud-action-widget">
        <svg class="action-frame-svg" viewBox="0 0 200 100">
            <!-- Corner bracket wrapping around outside of button: horizontal under button, chamfers up-right, goes up -->
            <path d="M 0 88 L 152 88 L 174 66 L 174 12" fill="none" stroke="rgba(0, 216, 246, 0.7)" stroke-width="1.5" />
            
            <!-- Three slanted slashes /// on the horizontal baseline -->
            <g fill="#00e5ff" transform="translate(75, 77) skewX(-32)">
                <rect x="0" y="0" width="3" height="7" rx="1" filter="url(#hudGlow)"/>
                <rect x="5.5" y="0" width="3" height="7" rx="1" filter="url(#hudGlow)"/>
                <rect x="11" y="0" width="3" height="7" rx="1" filter="url(#hudGlow)"/>
            </g>
        </svg>
        <div class="action-btn-container" id="containerBtn">
            <div class="action-neon-arc"></div>
            
            <input type="text" class="cmd-text-input" id="cmdInput" placeholder="Enter system command..." autocomplete="off">

            <!-- Chat Bubble Icon with cutout lines -->
            <svg class="chat-icon" id="iconAction" viewBox="0 0 24 24">
                <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
                <line x1="7" y1="8" x2="15" y2="8" stroke="#02141f" stroke-width="2" stroke-linecap="round"/>
                <line x1="7" y1="12" x2="17" y2="12" stroke="#02141f" stroke-width="2" stroke-linecap="round"/>
            </svg>

            <!-- Send Icon -->
            <svg class="send-icon" id="btnSend" viewBox="0 0 24 24">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" fill="#00e5ff"/>
            </svg>
        </div>
    </div>

    <!-- Quick Info Slide-out Panel (Compatible with main.py) -->
    <div class="info-panel" id="infoPanel">
        <div class="info-left-col" id="infoLeftCol"></div>
        <div class="info-right-col">
            <h2 id="infoTitle">Intelligence Intel</h2>
            <p id="infoDescription">Awaiting query parameters...</p>
        </div>
    </div>

    <!-- Full-Screen Deep Dive Panel (Compatible with main.py) -->
    <div class="deep-dive-panel" id="deepDivePanel">
        <div class="dd-header" id="ddTitle">Target Deep Dive</div>
        <div class="dd-content">
            <div class="dd-images" id="ddImages"></div>
            <div class="dd-text" id="ddText">Processing deeper context...</div>
        </div>
    </div>

    <!-- Full-Screen Lightbox Modal -->
    <div class="img-modal" id="imgModal" onclick="closeImageModal()">
        <img id="modalImg" src="" alt="Expanded View" onclick="event.stopPropagation();">
    </div>

    <script>
        const containerBtn = document.getElementById('containerBtn');
        const cmdInput = document.getElementById('cmdInput');
        const iconAction = document.getElementById('iconAction');
        const btnSend = document.getElementById('btnSend');

        containerBtn.addEventListener('click', function(e) {
            if (!containerBtn.classList.contains('expanded')) {
                containerBtn.classList.add('expanded');
                cmdInput.focus();
            }
        });

        btnSend.addEventListener('click', function(e) {
            e.stopPropagation();
            submitCommand();
        });

        cmdInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                submitCommand();
            } else if (e.key === 'Escape') {
                cmdInput.value = '';
                containerBtn.classList.remove('expanded');
                cmdInput.blur();
            }
        });

        function submitCommand() {
            const command = cmdInput.value.trim();
            if (command) {
                console.log("HYDRA_CMD:" + command);
                cmdInput.value = '';
                containerBtn.classList.remove('expanded');
                cmdInput.blur();
            }
        }

        function setCoreText(text) {
            const coreEl = document.getElementById('coreTitle');
            if (coreEl) {
                coreEl.innerText = text;
            }
        }
        
        function updateHUD() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase();
            const timeStr = now.toLocaleTimeString('en-GB', { hour12: false });
            
            const hudTime = document.getElementById('hudTime');
            const hudDate = document.getElementById('hudDate');
            
            if (hudTime) {
                hudTime.innerText = timeStr;
                hudTime.setAttribute('data-text', timeStr);
            }
            if (hudDate) {
                hudDate.innerText = dateStr;
                hudDate.setAttribute('data-text', dateStr);
            }
        }
        
        function updateRealNetwork(ssid, signal, speed) {
            const isOnline = ssid !== 'DISCONNECTED';
            const hudNetStatus = document.getElementById('hudNetStatus');
            const hudSSID = document.getElementById('hudSSID');
            const hudSignal = document.getElementById('hudSignal');
            const hudSpeed = document.getElementById('hudSpeed');

            if (hudNetStatus) {
                hudNetStatus.innerText = isOnline ? 'ONLINE' : 'OFFLINE';
                hudNetStatus.setAttribute('data-text', hudNetStatus.innerText);
            }
            if (hudSSID) {
                hudSSID.innerText = ssid;
                hudSSID.setAttribute('data-text', ssid);
            }
            if (hudSignal) {
                hudSignal.innerText = signal;
                hudSignal.setAttribute('data-text', signal);
            }
            if (hudSpeed) {
                hudSpeed.innerText = speed;
                hudSpeed.setAttribute('data-text', speed);
            }
        }
        
        setInterval(updateHUD, 1000);
        updateHUD();

        // Sporadic Glitch Effect Every 12 Seconds
        setInterval(() => {
            const elements = document.querySelectorAll('.target-glitch > div, .target-glitch span');
            elements.forEach(el => el.classList.add('glitch-active'));
            setTimeout(() => {
                elements.forEach(el => el.classList.remove('glitch-active'));
            }, 350);
        }, 12000);

        function triggerScreenSwipe(active) {
            const stage = document.querySelector('.main-stage');
            if (stage) stage.classList.toggle('swiped-left', active);
        }

        function populateInfoHUD(title, text, items) {
            document.body.classList.remove('deep-dive-active');
            setTimeout(() => {
                document.getElementById('infoTitle').innerText = title;
                document.getElementById('infoDescription').innerText = text;
                const leftCol = document.getElementById('infoLeftCol');
                leftCol.innerHTML = '';
                items.forEach(item => {
                    let imgSrc = item.img ? item.img : 'circle.png';
                    leftCol.innerHTML += `
                        <div class="info-card">
                            <img src="${imgSrc}" alt="Preview" onerror="this.onerror=null; this.src='circle.png';" onclick="openImageModal(this.src)">
                            <div class="source-txt">${item.source || 'HYDRA ARCHIVE'}</div>
                            <div class="detail-txt">${item.desc}</div>
                        </div>`;
                });
                triggerScreenSwipe(true);
            }, 300); 
        }

        function resetScreenSwipe() {
            document.body.classList.remove('deep-dive-active');
            triggerScreenSwipe(false);
        }

        function openImageModal(src) {
            if (src.includes('circle.png')) return;
            document.getElementById('modalImg').src = src;
            document.getElementById('imgModal').classList.add('active');
        }

        function closeImageModal() {
            document.getElementById('imgModal').classList.remove('active');
        }

        function openDeepDiveHUD(title, htmlContent, imagesList) {
            document.getElementById('ddTitle').innerText = title;
            document.getElementById('ddText').innerHTML = htmlContent;
            
            const imgContainer = document.getElementById('ddImages');
            imgContainer.innerHTML = '';
            imagesList.forEach(src => {
                if (src && !src.includes('circle.png')) {
                    imgContainer.innerHTML += `<img src="${src}" onclick="openImageModal(this.src)" onerror="this.style.display='none'">`;
                }
            });

            document.body.classList.add('deep-dive-active');
        }
    </script>
</body>
</html>
