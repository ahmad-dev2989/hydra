<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="100%" height="auto">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>

    <radialGradient id="footerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(2, 132, 199, 0.15)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)" />
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: 'Share Tech Mono', 'Consolas', monospace; }
    .display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="160" rx="16" fill="url(#footerBg)" stroke="#BAE6FD" stroke-width="1.5" />
  <circle cx="600" cy="80" r="220" fill="url(#footerGlow)" />

  <!-- Animated-style Divider Line -->
  <line x1="80" y1="25" x2="1120" y2="25" stroke="#E2E8F0" stroke-width="1" />
  <line x1="480" y1="25" x2="720" y2="25" stroke="#0284C7" stroke-width="2.5" />

  <!-- Footer Content -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <text y="0" class="display" font-size="16" font-weight="700" fill="#0F172A" letter-spacing="1">
      HYDRA SYSTEM INTERFACE • PERSONAL JARVIS OS
    </text>
    <text y="24" class="display" font-size="13" font-weight="500" fill="#64748B">
      Designed &amp; Engineered by <tspan fill="#0284C7" font-weight="700">Ahmad</tspan> • Autonomous Desktop Intelligence
    </text>
    <text y="46" class="mono" font-size="11" fill="#94A3B8">
      Open Source MIT License • Built with NVIDIA Nemotron, PyQt6, Three.js &amp; Python 3.12
    </text>
  </g>
</svg>
