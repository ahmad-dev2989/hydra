<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F7FE" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E8F4FD" />
    </linearGradient>

    <!-- Glass Surface Gradient -->
    <linearGradient id="glassSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.95)" />
      <stop offset="100%" stop-color="rgba(240, 247, 254, 0.85)" />
    </linearGradient>

    <!-- Cyan Glow Gradients -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(2, 132, 199, 0.22)" />
      <stop offset="60%" stop-color="rgba(0, 180, 216, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)" />
    </radialGradient>

    <radialGradient id="cornerGlow" cx="85%" cy="20%" r="40%">
      <stop offset="0%" stop-color="rgba(0, 229, 255, 0.18)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)" />
    </radialGradient>

    <!-- Glass Card Shadow -->
    <filter id="glassShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284C7" flood-opacity="0.12" />
    </filter>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'Share Tech Mono', 'Consolas', 'Courier New', monospace; }
    .display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; font-weight: 800; }
    .body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
    @keyframes pulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }
    .pulsing { animation: pulse 2.5s infinite ease-in-out; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="280" rx="20" fill="url(#bgGrad)" stroke="#BAE6FD" stroke-width="1.5" />

  <!-- Ambient Light Orbs -->
  <circle cx="600" cy="140" r="280" fill="url(#cyanGlow)" />
  <circle cx="1020" cy="60" r="180" fill="url(#cornerGlow)" />

  <!-- High-Tech Grid Accent Lines -->
  <g stroke="rgba(2, 132, 199, 0.12)" stroke-width="1" stroke-dasharray="4,6">
    <line x1="80" y1="0" x2="80" y2="280" />
    <line x1="1120" y1="0" x2="1120" y2="280" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="210" x2="1200" y2="210" />
  </g>

  <!-- Central Frosted Glass Card -->
  <rect x="50" y="30" width="1100" height="220" rx="16" fill="url(#glassSurface)" stroke="rgba(2, 132, 199, 0.35)" stroke-width="1.5" filter="url(#glassShadow)" />

  <!-- Sci-Fi Corner Brackets on Glass Card -->
  <path d="M 50 60 L 50 30 L 80 30" fill="none" stroke="#0284C7" stroke-width="3.5" />
  <path d="M 1150 60 L 1150 30 L 1120 30" fill="none" stroke="#0284C7" stroke-width="3.5" />
  <path d="M 50 220 L 50 250 L 80 250" fill="none" stroke="#0284C7" stroke-width="3.5" />
  <path d="M 1150 220 L 1150 250 L 1120 250" fill="none" stroke="#0284C7" stroke-width="3.5" />

  <!-- Top Bar: Status Chips -->
  <g transform="translate(80, 52)">
    <!-- Online status badge -->
    <rect x="0" y="0" width="130" height="26" rx="13" fill="rgba(2, 132, 199, 0.08)" stroke="rgba(2, 132, 199, 0.25)" stroke-width="1" />
    <circle cx="16" cy="13" r="4.5" fill="#10B981" />
    <text x="30" y="17" class="mono" font-size="11" font-weight="700" fill="#0369A1" letter-spacing="1">HUD ACTIVE</text>

    <!-- Telemetry badge -->
    <rect x="142" y="0" width="180" height="26" rx="13" fill="rgba(2, 132, 199, 0.08)" stroke="rgba(2, 132, 199, 0.25)" stroke-width="1" />
    <text x="154" y="17" class="mono" font-size="11" fill="#475569">LATENCY: <tspan fill="#0284C7" font-weight="700">&lt;180ms</tspan></text>

    <!-- Version badge (Right aligned) -->
    <rect x="850" y="0" width="190" height="26" rx="13" fill="rgba(2, 132, 199, 0.08)" stroke="rgba(2, 132, 199, 0.25)" stroke-width="1" />
    <text x="862" y="17" class="mono" font-size="11" fill="#475569">HYDRA OS • <tspan fill="#0284C7" font-weight="700">v2.5 NEXT-GEN</tspan></text>
  </g>

  <!-- Center Branding: Logo & Title -->
  <g transform="translate(600, 138)" text-anchor="middle">
    <!-- Main Title -->
    <text y="0" class="display" font-size="44" fill="url(#textGrad)" letter-spacing="4">H Y D R A</text>
    
    <!-- Subtitle / Tagline -->
    <text y="28" class="body" font-size="15" font-weight="600" fill="#475569" letter-spacing="2">
      AUTONOMOUS AI DESKTOP OPERATING SYSTEM
    </text>
  </g>

  <!-- Bottom Chips: Architecture Highlights -->
  <g transform="translate(600, 222)" text-anchor="middle">
    <!-- Feature Pill 1 -->
    <rect x="-380" y="-14" width="175" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="-292" y="4" class="mono" font-size="11.5" font-weight="600" fill="#0284C7">⚡ NVIDIA NEMOTRON</text>

    <!-- Feature Pill 2 -->
    <rect x="-190" y="-14" width="175" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="-102" y="4" class="mono" font-size="11.5" font-weight="600" fill="#0284C7">🎙️ DUPLEX NEURAL VOICE</text>

    <!-- Feature Pill 3 -->
    <rect x="0" y="-14" width="180" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="90" y="4" class="mono" font-size="11.5" font-weight="600" fill="#0284C7">👁️ SUB-PIXEL VISION</text>

    <!-- Feature Pill 4 -->
    <rect x="195" y="-14" width="185" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="287" y="4" class="mono" font-size="11.5" font-weight="600" fill="#0284C7">🛡️ AES-256 DPAPI VAULT</text>
  </g>
</svg>
